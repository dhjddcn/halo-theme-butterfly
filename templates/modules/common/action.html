<div
  class="side-actions fixed z-100 bottom-[40px] right-[-48px] transition-[opacity_0.5s,transform_0.5s] translate-x-[-58px]"
>
  <button
    class="flex-center my-[0.5rem] w-[2.2rem] h-[2.2rem] rounded-[.7rem] bg-[var(--theme)]"
    th:if="${theme.config.style.mode == 'user'}"
    type="button"
    title="浅色和深色模式转换"
    onclick="__BUTTERFLY_MAIN.theme.toggle()"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewBox="0 0 24 24">
      <path
        fill="var(--r-btn-color)"
        d="M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10a10 10 0 0 0 10-10A10 10 0 0 0 12 2m0 2a8 8 0 0 1 8 8a8 8 0 0 1-8 8z"
      />
    </svg>
  </button>
</div>
