<html
  xmlns:th="https://www.thymeleaf.org"
  xmlns:x-on="http://www.w3.org/1999/xhtml"
  th:replace="~{modules/layout :: layout (
  page = 'index',
  title = ${site.title + (#strings.isEmpty(site.subtitle) ? '' : ' - ' + site.subtitle)},
  content = ~{::content}
  )}"
>
  <!--/* 內容 */-->
  <th:block th:fragment="content">
    <header th:replace="~{modules/common/header :: h(above)}">
      <th:block th:fragment="above">
        <div>111</div>
      </th:block>
    </header>

    <main class="content h-[2000px] bg-amber w-full mt-[500px]"></main>
  </th:block>
</html>
