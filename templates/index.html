<html
  xmlns:th="https://www.thymeleaf.org"
  xmlns:x-on="http://www.w3.org/1999/xhtml"
  th:replace="~{modules/layout :: layout (
  page = 'index',
  title = ${site.title + (#strings.isEmpty(site.subtitle) ? '' : ' - ' + site.subtitle)},
  content = ~{::content}
  )}"
>
  <!--/* 內容 */-->
  <th:block th:fragment="content">
    <header class="header min-h-[60px] relative">
      <nav
        class="nav h-[60px] w-full absolute flex items-center justify-between flex-nowrap select-none top-0 px-[38px] text-[1.15rem] z-90 transition-opacity transition-transform duration-500 will-change-transform bg-red-2"
      ></nav>
    </header>

    <main class="content h-[2000px] bg-amber w-full mt-[500px]"></main>
  </th:block>
</html>
