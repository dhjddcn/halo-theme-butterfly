<html
  xmlns:th="https://www.thymeleaf.org"
  xmlns:x-on="http://www.w3.org/1999/xhtml"
  th:replace="~{modules/layout :: layout (
  page = 'index',
  title = ${site.title + (#strings.isEmpty(site.subtitle) ? '' : ' - ' + site.subtitle)},
  content = ~{::content}
  )}"
>
  <!--/* 內容 */-->
  <th:block th:fragment="content">
    <th:block th:replace="~{modules/common/header ::h('')}" />

    <main style="width: 100%; height: 2000px"></main>
  </th:block>
</html>
